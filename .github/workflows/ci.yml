name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: MahjongCore tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      # Release mode: the solver and deal tests are many times slower in debug.
      - run: swift test --package-path MahjongCore -c release -Xswiftc -enable-testing

  app:
    name: App build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project DumbMahjong.xcodeproj \
            -scheme DumbMahjong \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
